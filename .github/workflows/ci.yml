name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Node unit tests
        run: npm test

      - name: Cross-language interop (both directions)
        run: node scripts/interop.js

      - name: Multi-segment concurrent benchmark (smoke)
        run: python scripts/bench_multi.py --quick --no-unlimited

      - name: Multi-segment cross-language verify (5 segments)
        run: python scripts/verify_multi.py
