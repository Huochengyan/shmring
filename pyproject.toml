[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shmring"
version = "0.1.0"
description = "Lock-free cross-language shared-memory ring buffer: single writer, many readers, zero HTTP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "meta_codes" }]
keywords = ["shared-memory", "ring-buffer", "ipc", "seqlock", "electron", "zero-copy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://gitee.com/meta_codes/shmring"
Repository = "https://gitee.com/meta_codes/shmring"
Protocol = "https://gitee.com/meta_codes/shmring/blob/master/PROTOCOL.md"
Issues = "https://gitee.com/meta_codes/shmring/issues"

[tool.setuptools.packages.find]
include = ["shmring*"]
